<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Table & List Design</title>
    <link rel="stylesheet" href="/WebDev_Component/Img_List_Table/imglisttable.css">
</head>

<body>

    <img src="/WebDev_Component/Img_List_Table/developer.jpg" alt="developer">

    <table>
        <caption>Student Details</caption>
        <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Language</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Sanket</td>
                <td>developer</td>
                <td>HTML</td>
            </tr>

        </tbody>
        <tfoot>
            <tr>
                <td colspan="2">Sk</td>

                <td rowspan="2">CSS footer</td>
            </tr>
        </tfoot>
    </table>

    <ul type="square">
        <li>java</li>
        <li>Html</li>
        <li>CSS</li>
    </ul>

    <ol type="I">
        <li>java</li>
        <li>Html</li>
        <li>CSS</li>
    </ol>
</body>

</html>
