<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS list style</title>
    <style>
        nav ul {
            list-style: none;
            background-color: yellow;
            /* list-style-position: inside; used for getting marker inside */
            border: 1px solid #000;
            display: flex;
            /* padding: 25px; */
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li>Home</li>
            <li>Contact</li>
            <li>About</li>
        </ul>
    </nav>
</body>
</html>
