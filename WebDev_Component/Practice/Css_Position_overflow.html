<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Overflow and position property</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            width: 80vw;
            height: 130px;
            padding: 3px;
            margin: 3px;
            border: 2px solid #000;
        }

        .box1 {
            background-color: aquamarine;
            border: solid #000;
            /* position: relative;
            z-index: 1; */
            /* position: absolute;
            top: 50px;
            left: 50px; */
            /* position: sticky; */
            position: inherit;
        }

        .box2 {
            background-color: rgb(207, 226, 220);
            border: solid #000;
            /* position: fixed; */
            /* position: relative;
            top: -20px;
            left: 30px; */
        }

        .box3 {
            background-color: rgb(117, 235, 85);
            border: solid #000;
            /* position: relative;
            top: 40px;
            left: 20px; */
        }

        .box4 {
            background-color: rgb(22, 175, 241);
            border: solid #000;
        }
        .parent{
            padding: 40px;
            margin: 30px;
            border: 3px solid #000;

        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
    </div>

</body>

</html>
